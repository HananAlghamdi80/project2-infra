name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "apps/backend/**"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'

      - name: Build backend with Maven
        working-directory: apps/backend
        run: mvn clean package -DskipTests=false

      - name: Analyze code with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=HananAlghamdi80_project2hanan
            -Dsonar.organization=hanan-projects
            -Dsonar.host.url=https://sonarcloud.io

      - name: Azure Login using credentials JSON
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name p2acrhanan123
          docker build -t p2acrhanan123.azurecr.io/backend:latest ./apps/backend
          docker push p2acrhanan123.azurecr.io/backend:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update -n p2-backend -g p2-rg --image p2acrhanan123.azurecr.io/backend:latest
